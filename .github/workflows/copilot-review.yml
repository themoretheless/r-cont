name: Copilot Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write

    steps:
      - name: Request and collect Copilot review
        uses: themoretheless/.github/.github/actions/copilot-review@bb3377f2f424201379ab4e47e147f164f4014b38 # v1
        with:
          github-token: ${{ github.token }}
          fail-on-comments: true
