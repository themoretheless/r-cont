name: Copilot Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write

    steps:
      - name: Request and collect Copilot review
        uses: themoretheless/.github/.github/actions/copilot-review@3117a6afb233141f7f2b7809ed8b0866f3a29e28 # v1
        with:
          github-token: ${{ github.token }}
          fail-on-comments: true

